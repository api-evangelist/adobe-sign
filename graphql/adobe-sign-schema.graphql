  AGREEMENT_EMAIL_VIEWED
  AGREEMENT_DELEGATED
  AGREEMENT_ACTION_REQUESTED
  AGREEMENT_RECALLED
  AGREEMENT_REJECTED
  AGREEMENT_EXPIRED
  AGREEMENT_MODIFIED
  AGREEMENT_SHARED
  AGREEMENT_VAULTED
  AGREEMENT_KBA_AUTHENTICATED
  AGREEMENT_OFFLINE_SYNC
  AGREEMENT_USER_ACK_AGREEMENT_TO_SHARE
  AGREEMENT_UPLOADED_BY_SENDER
  AGREEMENT_SIGNED
  AGREEMENT_VIEWED
  AGREEMENT_ACTION_DELEGATED
  MEGASIGN_CREATED
  MEGASIGN_RECALLED
  MEGASIGN_SHARED
  WIDGET_CREATED
