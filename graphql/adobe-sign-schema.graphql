}

enum SignerStatus {
  WAITING_FOR_MY_SIGNATURE
  WAITING_FOR_MY_APPROVAL
  WAITING_FOR_MY_ACCEPTANCE
  WAITING_FOR_MY_FORM_FILLING
  WAITING_FOR_MY_DELEGATION
