# -------------------------------------------------------
# Query
# -------------------------------------------------------

type Query {
  # Base URIs
  baseUris: BaseUri

  # Agreements
  agreements(cursor: String, pageSize: Int): AgreementList
  agreement(agreementId: ID!): Agreement
  agreementDocuments(agreementId: ID!): [AgreementDocument]
  agreementSigningUrls(agreementId: ID!): [SigningUrlSetInfo]
  agreementAuditTrail(agreementId: ID!): Document
  agreementFormFields(agreementId: ID!): [SignerFormField]

  # Library Documents
  libraryDocuments(cursor: String, pageSize: Int): LibraryDocumentList
  libraryDocument(libraryDocumentId: ID!): LibraryDocument
  libraryDocumentDocuments(libraryDocumentId: ID!): [Document]

  # Widgets
  widgets(cursor: String, pageSize: Int): WidgetList
  widget(widgetId: ID!): Widget

  # MegaSigns
  megaSigns(cursor: String, pageSize: Int): MegaSignList
  megaSign(megaSignId: ID!): MegaSign
  megaSignChildAgreements(megaSignId: ID!, cursor: String, pageSize: Int): AgreementList

  # Users
  users(cursor: String, pageSize: Int): UserList
  user(userId: ID!): UserInfo
  userAgreements(userId: ID!, cursor: String, pageSize: Int): AgreementList
  userLibraryDocuments(userId: ID!, cursor: String, pageSize: Int): LibraryDocumentList
  me: UserInfo

  # Groups
  groups(cursor: String, pageSize: Int): GroupList
  group(groupId: ID!): GroupInfo
  groupUsers(groupId: ID!, cursor: String, pageSize: Int): UserList

  # Webhooks
  webhooks(cursor: String, pageSize: Int, resourceType: ResourceType): WebhookList
  webhook(webhookId: ID!): WebhookInfo

  # Workflows
  workflows(cursor: String, pageSize: Int): WorkflowList
  workflow(workflowId: ID!): WorkflowDefinition
}

# -------------------------------------------------------
# Mutation
# -------------------------------------------------------

type Mutation {
  # Transient Documents
  uploadTransientDocument(fileName: String!, file: String!, mimeType: String): ResourceUpload

  # Agreements
  createAgreement(input: AgreementInput!): Agreement
  cancelAgreement(agreementId: ID!, comment: String, notifySigner: Boolean): Boolean
  deleteAgreement(agreementId: ID!): Boolean
  delegateAgreementSigner(agreementId: ID!, participantId: ID!, input: Delegate!): Boolean
  sendAgreementReminder(agreementId: ID!, comment: String, recipientParticipantIds: [ID]): Boolean

  # Library Documents
  createLibraryDocument(name: String!, fileInfos: [FileInfoInput]!, sharingMode: String, templateTypes: [LibraryType]): LibraryDocument
  deleteLibraryDocument(libraryDocumentId: ID!): Boolean

  # Widgets
  createWidget(input: AgreementInput!): Widget
  updateWidgetStatus(widgetId: ID!, status: WidgetStatus!): Widget

  # MegaSigns
  createMegaSign(input: AgreementInput!, recipientSetsInfo: [ParticipantSetInput]!): MegaSign
  cancelMegaSign(megaSignId: ID!, comment: String): Boolean

  # Users
  createUser(email: EmailAddress!, firstName: String!, lastName: String!, roles: [String]): UserInfo
  updateUser(userId: ID!, firstName: String, lastName: String, company: String, title: String, phone: String): UserInfo

  # Groups
  createGroup(groupName: String!): GroupInfo
  updateGroup(groupId: ID!, groupName: String): GroupInfo
  deleteGroup(groupId: ID!): Boolean
  addUserToGroup(groupId: ID!, userId: ID!): Boolean
  removeUserFromGroup(groupId: ID!, userId: ID!): Boolean

  # Webhooks
  createWebhook(input: WebhookInput!): WebhookInfo
  updateWebhookState(webhookId: ID!, state: String!): WebhookInfo
  deleteWebhook(webhookId: ID!): Boolean
}

# -------------------------------------------------------
# Subscription
# -------------------------------------------------------

type Subscription {
  agreementStatusChanged(agreementId: ID): Agreement
  agreementSigned(agreementId: ID): ESignature
  widgetSubmitted(widgetId: ID): Agreement
  megaSignChildCompleted(megaSignId: ID): MegaSignChild
}
