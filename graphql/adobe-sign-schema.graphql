"""
Adobe Sign (Acrobat Sign) GraphQL Schema
Conceptual schema based on the Acrobat Sign REST API v6.
Reference: https://secure.na1.adobesign.com/public/docs/restapi/v6
"""

# -------------------------------------------------------
# Scalars
# -------------------------------------------------------

scalar DateTime
scalar URL
scalar EmailAddress
scalar JSON

# -------------------------------------------------------
# Enums
# -------------------------------------------------------

enum AgreementStatus {
  OUT_FOR_SIGNATURE
  OUT_FOR_APPROVAL
  OUT_FOR_ACCEPTANCE
  OUT_FOR_FORM_FILLING
  OUT_FOR_DELIVERY
  AUTHORING
  CANCELLED
  SIGNED
  APPROVED
  ACCEPTED
  FORM_FILLED
  DELIVERED
  EXPIRED
  ARCHIVED
  PREFILL
  WAITING_FOR_FAXIN
  WAITING_FOR_VERIFICATION
  WIDGET_WAITING_FOR_VERIFICATION
  DRAFT
  DOCUMENTS_NOT_YET_PROCESSED
  WAITING_FOR_PREFILL
}

enum ParticipantRole {
  SIGNER
  APPROVER
  ACCEPTOR
  FORM_FILLER
  CERTIFIED_RECIPIENT
  CC
  DELEGATE_TO_SIGNER
  DELEGATE_TO_APPROVER
  DELEGATE_TO_ACCEPTOR
  DELEGATE_TO_FORM_FILLER
  DELEGATE_TO_CERTIFIED_RECIPIENT
