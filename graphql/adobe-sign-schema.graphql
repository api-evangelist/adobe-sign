  WAITING_FOR_OTHERS
  SIGNED
  APPROVED
  ACCEPTED
  FORM_FILLED
  DELIVERED
  CANCELLED
  EXPIRED
  HIDDEN
  RECALLED
  WAITING_FOR_FAXIN
  WAITING_FOR_VERIFICATION
