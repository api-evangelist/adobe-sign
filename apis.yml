aid: adobe-sign
name: Adobe Acrobat Sign
description: >-
  Adobe Acrobat Sign (formerly Adobe Sign and EchoSign) is a cloud-based
  electronic signature and digital document workflow service that lets
  organizations send, sign, track, and manage legally binding agreements.
  The Acrobat Sign REST API v6 provides programmatic access to agreements,
  templates, transient documents, workflows, users, groups, and webhooks
  using OAuth 2.0 authentication against a region-specific API access point.
type: Index
