apis:
  - aid: adobe-sign:adobe-acrobat-sign-api
    name: Adobe Acrobat Sign REST API
    description: >-
      REST API v6 for Adobe Acrobat Sign covering agreements, library templates,
      transient documents, workflows, megaSigns, widgets, users, groups,
      webhooks, and reports. Clients must call GET /baseUris first to discover
      the region-specific apiAccessPoint, then authenticate with OAuth 2.0
      Bearer tokens.
    humanURL: https://opensource.adobe.com/acrobat-sign/developer_guide/index.html
    baseURL: https://api.na4.adobesign.com/api/rest/v6
